name: 24/7 Keep-Alive (Prevent Render Sleep)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-pinger
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Continuous 4-Minute Keep-Alive Loop
        run: |
          for i in $(seq 1 14); do
            echo "--- Keep-Alive Cycle $i ($(date -u)) ---"
            for URL in "https://tchapotchapo.com/api/ping" "https://www.tchapotchapo.com/api/ping" "https://tchapotchapo.store/api/ping" "https://tchapo-backend-hszc.onrender.com/api/ping"; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "failed")
              echo "$URL -> Status: $STATUS"
            done
            if [ "$i" -lt 14 ]; then
              sleep 240
            fi
          done
