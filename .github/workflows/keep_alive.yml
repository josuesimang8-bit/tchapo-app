name: 24/7 Keep-Alive (Prevent Render Sleep)

on:
  schedule:
    # Run every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Tchapo Tchapo Server
        run: |
          echo "Sending keep-alive ping to Tchapo Tchapo..."
          for URL in "https://tchapotchapo.store/api/ping" "https://tchapo-backend-hszc.onrender.com/api/ping" "https://tchapotchapo.com/api/ping"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "failed")
            echo "$URL -> Status: $STATUS"
          done
