name: 24/7 Keep-Alive (Prevent Render Sleep)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-pinger
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping All Tchapo Endpoints
        run: |
          for URL in "https://tchapotchapo.com/api/ping" "https://tchapotchapo.store/api/ping" "https://tchapo-backend-hszc.onrender.com/api/ping"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "failed")
            echo "$URL -> Status: $STATUS"
          done
